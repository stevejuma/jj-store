[workspace]
exclude = ["desktop", "runtime/local-agent", "runtime/compute"]
members = ["crates/jj-store-read-index", "crates/jj-workflow", "crates/jj-store-capture", "crates/jj-collab", "crates/jj-work", "crates/jj-agent", "crates/jj-review", "crates/jj-store-model", "crates/jj-store-jj", "crates/jj-store-cli", "crates/jj-store-object", "crates/jj-store-wal", "crates/jj-store-replication", "crates/jj-store-service", "crates/jj-store-rpc", "crates/jj-store-server", "crates/jj-store-http", "crates/jj-store-adapters", "crates/jj-store-tantivy"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["LapisMD contributors"]
repository = "https://github.com/stevejuma/jj-store"
homepage = "https://stevejuma.github.io/jj-store/"

[workspace.dependencies]
jj-store-read-index = { path = "crates/jj-store-read-index", version = "0.1.0" }
jj-workflow = { path = "crates/jj-workflow", version = "0.1.0" }
jj-store-capture = { path = "crates/jj-store-capture", version = "0.1.0" }
jj-collab = { path = "crates/jj-collab", version = "0.1.0" }
jj-work = { path = "crates/jj-work", version = "0.1.0" }
jj-agent = { path = "crates/jj-agent", version = "0.1.0" }
jj-review = { path = "crates/jj-review", version = "0.1.0" }
jj-store-tantivy = { path = "crates/jj-store-tantivy", version = "0.1.0" }
jj-store-adapters = { path = "crates/jj-store-adapters", version = "0.1.0" }
schemars = "1.2.1"
jj-store-model = { path = "crates/jj-store-model", version = "0.1.0" }
jj-store-object = { path = "crates/jj-store-object", version = "0.1.0" }
jj-store-wal = { path = "crates/jj-store-wal", version = "0.1.0" }
jj-store-replication = { path = "crates/jj-store-replication", version = "0.1.0" }
jj-store-service = { path = "crates/jj-store-service", version = "0.1.0" }
jj-store-rpc = { path = "crates/jj-store-rpc", version = "0.1.0" }
jj-store-jj = { path = "crates/jj-store-jj", version = "0.1.0" }
jj-store-server = { path = "crates/jj-store-server", version = "0.1.0" }
jj-store-http = { path = "crates/jj-store-http", version = "0.1.0" }
jj-lib = "=0.46.0"
jj-cli = "=0.46.0"

[profile.dev]
debug = 0

[profile.test]
debug = 0

