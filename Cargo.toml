[workspace]
members = ["crates/jj-store-model", "crates/jj-store-jj", "crates/jj-store-cli", "crates/jj-store-object", "crates/jj-store-wal", "crates/jj-store-service", "crates/jj-store-rpc"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
authors = ["LapisMD contributors"]

[workspace.dependencies]
jj-store-model = { path = "crates/jj-store-model" }
jj-store-object = { path = "crates/jj-store-object" }
jj-store-wal = { path = "crates/jj-store-wal" }
jj-store-service = { path = "crates/jj-store-service" }
jj-store-rpc = { path = "crates/jj-store-rpc" }
jj-store-jj = { path = "crates/jj-store-jj" }
jj-lib = "=0.45.1"
jj-cli = "=0.45.1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
