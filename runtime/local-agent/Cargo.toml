[workspace]
members = ["vendor/buzz-agent", "tools"]
resolver = "2"

[package]
name = "jj-store-local-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
buzz-agent = { path = "vendor/buzz-agent" }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
