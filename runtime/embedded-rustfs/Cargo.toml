[workspace]

[package]
name = "jj-store-embedded-rustfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Separate managed RustFS runtime for jj-store native storage"
repository = "https://github.com/stevejuma/jj-store"
homepage = "https://stevejuma.github.io/jj-store/"
readme = "README.md"

[[bin]]
name = "jj-store-rustfs"
path = "src/main.rs"

[dependencies]
rustfs = { version = "=1.0.0", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
