syntax = "proto3";
package jj_store.probe;
// M0 test-only protocol, not a published application or storage contract.
service PublicationProbe {
  rpc Update (Transition) returns (Heads);
  rpc Read (Empty) returns (Heads);
}
message Empty {}
message Transition { repeated bytes old_ids = 1; bytes new_id = 2; bytes expected_head = 3; }
message Heads { repeated bytes ids = 1; }
