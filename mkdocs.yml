site_name: jj-store documentation
site_description:
  Local-first JJ repositories, collaboration and application operations
site_dir: docs/build
docs_dir: docs/site
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  features:
    - content.code.copy
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
hooks:
  - scripts/docs/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
extra_css:
  - assets/generated/app-theme.css
  - assets/manual.css
  - assets/layout.css
extra_javascript:
  - assets/theme.js
  - assets/embed.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - Getting started:
      - Installation and setup: getting-started/install.md
      - Choose a repository context: getting-started/contexts.md
      - Native repository tutorial: getting-started/native.md
      - Existing JJ folder tutorial: getting-started/local.md
      - First project and task: getting-started/work.md
  - Concepts:
      - Installations, repositories and workspaces: concepts/repositories.md
      - Snapshots and publication: concepts/snapshots.md
      - Projects and linked code: concepts/projects.md
      - Agents, threads and reviews: concepts/collaboration.md
      - Glossary: concepts/glossary.md
  - Guides:
