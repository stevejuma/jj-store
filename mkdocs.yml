      - Editing and conflicts: guides/editing.md
      - Projects, tasks and discussion: guides/work.md
      - Agent capture: guides/capture.md
      - Interactive agent sessions: guides/agent-execution.md
      - Internal workspace command: cli/jj-agent-workspace.md
      - Reviews and reactions: guides/reviews.md
      - Search: guides/search.md
      - Git interoperability: guides/git.md
      - Repository conversion: guides/conversion.md
      - Sync and reconciliation: guides/sync.md
      - Settings and maintenance: guides/settings.md
      - Troubleshooting: guides/troubleshooting.md
  - CLI reference:
