name: Changesets release orchestration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jj-store-version-orchestration
  cancel-in-progress: false
jobs:
  version:
    if:
      github.repository == 'stevejuma/jj-store' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check:dependency-intake
      - name: Guard the complete source-owned Node22 version recipe
        id: runtime
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f
        with:
          qualification-file: .github/versioning-runtime.json
          detect-release-intent: true
      - name: Mint repository-scoped version PR token
        if: steps.runtime.outputs.hasChangesets == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # v1.9.0 stays on Changesets CLI v2. Action v2 rejects these inputs.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        id: changesets
        if: steps.runtime.outputs.hasChangesets == 'true'
        with:
          version: pnpm release:version
          publish: pnpm release:orchestrate
          commit: Version jj-store packages
          title: Version Packages
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ github.token }}
      - name: Run checks for the generated release PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          branch=$(gh pr view "$RELEASE_PR" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch" -f all_checks=true
      - name: Continue existing release orchestration without a PR writer
        if: steps.runtime.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release:orchestrate
