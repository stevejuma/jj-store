name: Publish qualified release
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string
      source:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  identity:
    if:
      github.repository == 'stevejuma/jj-store' && github.ref ==
      'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verify source and coordinated version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: |
          node --input-type=module -e 'import {version,validateTag} from "./scripts/release-metadata.mjs"; if (!/^[a-f0-9]{40}$/.test(process.env.RELEASE_SOURCE)) throw Error("invalid source"); validateTag(process.env.RELEASE_TAG,version());'
          git merge-base --is-ancestor HEAD origin/main
  qualify:
    permissions:
      contents: read
      actions: read
    needs: identity
    uses: ./.github/workflows/ci-heavy.yml
    with:
      ref: ${{ inputs.source }}
  archives:
    needs: qualify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      JJ_STORE_BUILD_FREE_GIB: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            runtime/embedded-rustfs -> target
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-bundle-${{ github.run_attempt }}
          path: web/dist
      - run:
          pnpm dev:cargo -- build -p jj-store --bins --release --locked --target
          ${{ matrix.target }}
      - run:
          pnpm dev:cargo -- build --manifest-path
          runtime/embedded-rustfs/Cargo.toml --release --locked --target ${{
          matrix.target }}
      - run: node scripts/release-archive.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  packages:
    needs: archives
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      JJ_STORE_BUILD_FREE_GIB: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: |
          node scripts/package-check.mjs
          pnpm dev:cargo -- package --workspace --locked
          pnpm dev:cargo -- package --manifest-path runtime/embedded-rustfs/Cargo.toml --locked
          cargo publish --workspace --locked --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crate-archives
          path: |
            target/package/*.crate
            runtime/embedded-rustfs/target/package/*.crate
          if-no-files-found: error
  image:
    needs: [archives, packages]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: binary-${{ matrix.target }}
          path: dist
      - name: Prepare exact qualified payload
        run: |
          (cd dist && sha256sum --check ./*.sha256)
          mkdir -p .release/extracted .release/image
          tar -xzf dist/*.tar.gz -C .release/extracted
          cp .release/extracted/*/bin/jj-store .release/image/jj-store
          cp -R .release/extracted/*/web .release/image/web
          cp -R .release/extracted/*/licenses .release/image/licenses
          cp LICENSE.md .release/image/LICENSE.md
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: jj-store:candidate
          platforms: ${{ matrix.platform }}
          sbom: true
      - run: python3 scripts/container-acceptance.py jj-store:candidate
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: jj-store:candidate
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: push
        with:
          context: .
          push: true
          tags:
            ghcr.io/stevejuma/jj-store:source-${{ inputs.source }}-${{
            matrix.arch }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - name: Record qualified architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "dist/image-$IMAGE_ARCH.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-digest-${{ matrix.arch }}
          path: dist/image-*.digest
          if-no-files-found: error
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign exact architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/stevejuma/jj-store@$IMAGE_DIGEST"
  crates:
    needs: [packages, image]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
      - uses: ./.github/actions/setup
      - name: Recreate verified package archives
        run: |
          pnpm dev:cargo -- package --workspace --locked
          pnpm dev:cargo -- package --manifest-path runtime/embedded-rustfs/Cargo.toml --locked
      - id: existing
        run: node scripts/release-registry.mjs --status
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
        if: steps.existing.outputs.missing != '0'
      - name: Publish verified missing versions
        if: steps.existing.outputs.missing != '0'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release-registry.mjs --publish
      - run:
          cargo install jj-store --version "$(node --input-type=module -e
          'import {version} from "./scripts/release-metadata.mjs";
          console.log(version())')" --locked --root /tmp/jj-store-install
      - run: |
          /tmp/jj-store-install/bin/jj-store --version
          /tmp/jj-store-install/bin/jj-store-jj store --help
          test ! -e /tmp/jj-store-install/bin/jj
  github:
    needs: [crates, image, archives]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-digest-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: node scripts/release-finalize.mjs
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159
      - name: Sign release image index
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/stevejuma/jj-store:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          cosign sign --yes "ghcr.io/stevejuma/jj-store@$digest"
