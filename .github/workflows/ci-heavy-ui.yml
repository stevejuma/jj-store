name: UI acceptance qualification
run-name:
  UI acceptance qualification · ${{ inputs.source }} · producer ${{
  inputs.producer_run || github.run_id }}/${{ inputs.producer_attempt ||
  github.run_attempt }}
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: true
        description: Full qualification producer run ID
      producer_attempt:
        type: string
        required: true
        description: Producer run attempt
  workflow_call:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: false
        description: Full qualification producer run ID
        default: ""
      producer_attempt:
        type: string
        required: false
        description: Producer run attempt
        default: ""
      cache_write:
        type: string
        default: "false"
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
  CI_SOURCE: ${{ inputs.source }}
  CI_PRODUCER_RUN: ${{ inputs.producer_run || github.run_id }}
  CI_PRODUCER_ATTEMPT: ${{ inputs.producer_attempt || github.run_attempt }}
  JJ_STORE_CI_REPORTS: "1"
  PLAYWRIGHT_JUNIT_OUTPUT_FILE:
    ${{ github.workspace }}/.release/ci-results/playwright.xml
jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: storybook
            shard: 1/3
            name: Storybook interactions (shard 1/3)
          - lane: storybook
            shard: 2/3
            name: Storybook interactions (shard 2/3)
          - lane: storybook
            shard: 3/3
            name: Storybook interactions (shard 3/3)
          - lane: browser
            shard: 1/2
            name: Application browser (shard 1/2)
          - lane: browser
            shard: 2/2
            name: Application browser (shard 2/2)
          - lane: catalog
            name: Static catalog browser
          - lane: help
            name: Help (Chromium and WebKit)
    env:
      JJ_STORE_CI_PREBUILT: "1"
      JJ_STORE_REAL_SHARD: ${{ matrix.shard }}
      JJ_STORE_BROWSER_SHARD: ${{ matrix.shard }}
      JJ_STORE_DEV_RUSTFS_RUNTIME:
        ${{ github.workspace
        }}/runtime/embedded-rustfs/target/debug/jj-store-rustfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Verify source, successful producers and artifact checksums
        run:
          node scripts/ci-exec.mjs artifact-download -- node
          scripts/ci-artifacts.mjs consume ${{ matrix.lane }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: ${{ matrix.lane == 'git-cycle' && 'true' || 'false' }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Help WebKit
        if: matrix.lane == 'help'
        run: pnpm exec playwright install --with-deps webkit
      - name: Run browser acceptance
        run:
          node scripts/ci-exec.mjs browser -- node scripts/ci-browser.mjs ${{
          matrix.lane }}
      - name: Preserve results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: ui-${{ matrix.lane }}-${{ strategy.job-index }}
    name: ${{ matrix.name }}
concurrency:
  group: qualification-ui-${{ inputs.source }}-${{ github.event_name }}
  cancel-in-progress: false
