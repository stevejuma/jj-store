name: Publish main container image
on:
  workflow_run:
    workflows: [PR checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publish-main-image
  cancel-in-progress: false
jobs:
  source:
    if:
      github.repository == 'stevejuma/jj-store' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: identity
        env:
          SOURCE: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$SOURCE" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node scripts/image-tags.mjs source "$SOURCE"
          echo "revision=$SOURCE" >> "$GITHUB_OUTPUT"
  web:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: ./.github/actions/setup
        with:
          capability: node
          native-dependencies: "false"
          build-tools: "false"
      - run: pnpm web:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: main-image-web-${{ github.run_attempt }}
          path: web/dist
          retention-days: 3
          if-no-files-found: error
  architecture:
    needs: [source, web]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            arch: arm64
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      JJ_STORE_BUILD_FREE_GIB: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: ./.github/actions/setup
        with:
          build-tools: "false"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          key: main-image-${{ matrix.arch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: main-image-web-${{ github.run_attempt }}
          path: web/dist
      - run:
          pnpm dev:cargo -- build -p jj-store --bin jj-store --release --locked
      - name: Prepare source-bound payload
        run: |
          mkdir -p .release/image/licenses
          cp target/release/jj-store .release/image/jj-store
          cp -R web/dist .release/image/web
          cp -R docs/licenses/. .release/image/licenses/
          cp LICENSE.md .release/image/LICENSE.md
      - id: tag
        env:
          SOURCE: ${{ needs.source.outputs.revision }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run:
          echo "value=$(node scripts/image-tags.mjs architecture "$SOURCE"
          "$IMAGE_ARCH")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: jj-store:candidate
          platforms: ${{ matrix.platform }}
          sbom: true
      - run: python3 scripts/container-acceptance.py jj-store:candidate
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: jj-store:candidate
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: push
        with:
          context: .
          push: true
          tags: ghcr.io/stevejuma/jj-store:${{ steps.tag.outputs.value }}
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - name: Record architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: printf '%s\n' "$IMAGE_DIGEST" > "image-$IMAGE_ARCH.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: main-image-digest-${{ matrix.arch }}
          path: image-*.digest
          retention-days: 3
          if-no-files-found: error
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign architecture digest
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/stevejuma/jj-store@$IMAGE_DIGEST"
  index:
    needs: [source, architecture]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.revision }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: main-image-digest-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish immutable source and rolling main tags
        env:
          SOURCE: ${{ needs.source.outputs.revision }}
        run: |
          tag=$(node scripts/image-tags.mjs source "$SOURCE")
          images=()
          for file in dist/image-*.digest; do
            digest=$(cat "$file")
            test "${digest#sha256:}" != "$digest"
            images+=("ghcr.io/stevejuma/jj-store@$digest")
          done
          test "${#images[@]}" = 2
          if manifest=$(docker buildx imagetools inspect "ghcr.io/stevejuma/jj-store:$tag" --format '{{json .Manifest}}' 2>inspect.err); then
            test "$(jq '.manifests | length' <<< "$manifest")" = 2
            for image in "${images[@]}"; do
              jq -e --arg digest "${image#*@}" '.manifests | any(.digest == $digest)' <<< "$manifest"
            done
          elif grep -Eiq 'not found|manifest unknown' inspect.err; then
            docker buildx imagetools create --tag "ghcr.io/stevejuma/jj-store:$tag" "${images[@]}"
          else
            cat inspect.err >&2
            exit 1
          fi
          manifest=$(docker buildx imagetools inspect "ghcr.io/stevejuma/jj-store:$tag" --format '{{json .Manifest}}')
          digest=$(jq -r .digest <<< "$manifest")
          test "${digest#sha256:}" != "$digest"
          docker buildx imagetools create --tag ghcr.io/stevejuma/jj-store:main "ghcr.io/stevejuma/jj-store@$digest"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign source image index
        run: cosign sign --yes "ghcr.io/stevejuma/jj-store@$IMAGE_DIGEST"
