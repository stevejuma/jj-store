name: Publish specification to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['spec/**', 'docs/**', 'scripts/spec/**', 'scripts/docs/**', 'scripts/docs.mjs', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', 'pnpm-lock.yaml', '.github/workflows/publish-spec-pages.yml']
  pull_request:
    paths: ['spec/**', 'docs/**', 'scripts/spec/**', 'scripts/docs/**', 'scripts/docs.mjs', 'mkdocs.yml', 'pyproject.toml', 'uv.lock', 'pnpm-lock.yaml', '.github/workflows/publish-spec-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: Render specification and application manual
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /jj-store/
        run: |
          pnpm spec:build
          pnpm spec:links
          node scripts/docs.mjs render
          mkdir -p spec/book/manual
          cp -R docs/build/. spec/book/manual/
          test -f spec/book/index.html
          test -f spec/book/current/progress/M30/index.html
          test -f spec/book/manual/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: spec/book
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
