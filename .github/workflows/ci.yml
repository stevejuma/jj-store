name: PR checks
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ""
      all_checks:
        type: boolean
        default: false
        description: Run all standard checks
      cache_trial:
        type: boolean
        default: false
        description:
          Run the bounded three-pair compilation-cache comparison (branch only)
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      all_checks:
        type: boolean
        default: false
        description: Run all standard checks
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
  JJ_STORE_CI_REPORTS: "1"
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      backend: ${{ steps.plan.outputs.backend }}
      ui_source: ${{ steps.plan.outputs.ui_source }}
      ui_browser: ${{ steps.plan.outputs.ui_browser }}
      help: ${{ steps.plan.outputs.help }}
      catalog: ${{ steps.plan.outputs.catalog }}
      contracts: ${{ steps.plan.outputs.contracts }}
      packages: ${{ steps.plan.outputs.packages }}
      backend_packages: ${{ steps.plan.outputs.backend_packages }}
      selection: ${{ steps.plan.outputs.selection }}
      cache_write: ${{ steps.plan.outputs.cache_write }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Materialize pinned shared Rust sources into sibling Cargo paths
        run: |
          node scripts/ci-lapis-source.mjs
          node scripts/ci-redaction-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_ALL_CHECKS: ${{ inputs.all_checks }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
    name: Change selection
  format:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: format
          native-dependencies: "false"
          build-tools: "false"
      - name: Rust and source formatting
        run: |
          pnpm format:rust:check
          pnpm exec prettier --check .
    name: Formatting
  tooling:
    needs: [plan]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: tooling
          native-dependencies: "false"
          build-tools: "false"
      - name: Governance fixtures
        run: pnpm test:governance
      - name: Specification tooling
        run: pnpm test:spec
      - name: Release and CI tooling
        run: pnpm release:check
    name: Tooling regression tests
  governance:
    needs: [plan]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: node
          native-dependencies: "false"
          build-tools: "false"
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Static architecture and specification checks
        run: |
          pnpm check:architecture
          pnpm check:ui-ownership
          pnpm spec:validate --only governance,summary,fileLimits,verification
      - name: Progress evidence gate
        if: |-
          (github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))) && !(github.event.pull_request.user.type == 'Bot' && (contains(fromJSON('["dependabot[bot]","renovate[bot]","lapismd-dependency-bot[bot]"]'), github.event.pull_request.user.login) || (vars.LAPIS_DEPENDENCY_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.LAPIS_DEPENDENCY_BOT_LOGIN)))
        run: pnpm check:progress
      - name: Spec-first gate
        if: |-
          (github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))) && !(github.event.pull_request.user.type == 'Bot' && (contains(fromJSON('["dependabot[bot]","renovate[bot]","lapismd-dependency-bot[bot]"]'), github.event.pull_request.user.login) || (vars.LAPIS_DEPENDENCY_BOT_LOGIN != '' && github.event.pull_request.user.login == vars.LAPIS_DEPENDENCY_BOT_LOGIN)))
        run:
          pnpm spec:first --base "$JJ_STORE_CHECK_BASE" --head
          "$JJ_STORE_CHECK_REVISION"
      - name: Release intent gate
        if: |-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run: node scripts/changeset-check.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - name: Install checksum-pinned actionlint
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          archive="$tool_dir/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -version
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: actionlint
    name: Specification and release policy
  fast:
    needs:
      - plan
      - format
      - tooling
      - governance
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - run: node scripts/ci-required.mjs
        env:
          CI_STAGE: early
          CI_PLAN: "{}"
          CI_JOBS: ${{ toJSON(needs) }}
    name: Preflight gate
  build:
    needs: [plan]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: target
      CI_PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          fetch-rust: "false"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
        id: rust-cache
        name: Restore Rust dependency cache
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - name: Fetch locked dependencies after cache restoration
        run: cargo fetch --locked
      - run:
          node scripts/ci-exec.mjs rust-build -- node scripts/ci-build.mjs
          ordinary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-ordinary-${{ github.run_attempt }}
          compression-level: 0
          path: .release/tests-ordinary.tar.zst*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: ordinary-build
    name: Build standard Rust tests
  rust:
    needs:
      - plan
      - build
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      CARGO_TARGET_DIR: target
      CI_SHARD: ${{ matrix.shard }}
      CI_PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tests-ordinary-${{ github.run_attempt }}
          path: .release
      - run:
          node scripts/ci-exec.mjs rust-tests -- node scripts/ci-tests.mjs run
          ordinary
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: ordinary-${{ matrix.shard }}
    name: Standard Rust tests (shard ${{ matrix.shard }}/4)
  targeted_build:
    needs: [plan]
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: target
      CI_PACKAGES: ${{ needs.plan.outputs.backend_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          fetch-rust: "false"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          key: targeted-backend-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
        name: Restore targeted backend dependency cache
      - name: Fetch locked dependencies after cache restoration
        run: cargo fetch --locked
      - run:
          node scripts/ci-exec.mjs targeted-build -- node scripts/ci-build.mjs
          targeted
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-targeted-${{ github.run_attempt }}
          compression-level: 0
          path: .release/tests-targeted.tar.zst*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: targeted-build
    name: Build affected backend tests
  targeted:
    needs:
      - plan
      - targeted_build
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 1
          - 2
    env:
      CARGO_TARGET_DIR: target
      CI_SHARD: ${{ matrix.shard }}
      CI_PACKAGES: ${{ needs.plan.outputs.backend_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/native-git
      - uses: ./.github/actions/setup
        with:
          capability: archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tests-targeted-${{ github.run_attempt }}
          path: .release
      - run:
          node scripts/ci-exec.mjs targeted-tests -- node scripts/ci-tests.mjs
          run targeted
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: targeted-${{ matrix.shard }}
    name: Affected backend tests (shard ${{ matrix.shard }}/2)
  web:
    needs: [plan]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: node
          native-dependencies: "false"
          build-tools: "false"
      - run: |
          pnpm web:check
          pnpm web:test
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: web-unit
    if: >-
      needs.plan.outputs.ui_source == 'true' || needs.plan.outputs.ui_browser ==
      'true' || needs.plan.outputs.help == 'true' ||
      needs.plan.outputs.contracts == 'true'
    name: Web type checks and unit tests
  catalog_unit:
    needs: [plan]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          capability: node
          native-dependencies: "false"
          build-tools: "false"
      - run: |
          pnpm catalog:check
          pnpm catalog:test
      - name: Preserve test results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: catalog-unit
    if: needs.plan.outputs.catalog == 'true'
    name: Catalog type checks and unit tests
  ui:
    name: UI acceptance
    needs: [plan]
    if: >-
      needs.plan.outputs.ui_source == 'true' || needs.plan.outputs.ui_browser ==
      'true' || needs.plan.outputs.help == 'true' || needs.plan.outputs.catalog
      == 'true'
    uses: ./.github/workflows/ci-ui.yml
    with:
      source: ${{ needs.plan.outputs.source }}
      cache_write: ${{ needs.plan.outputs.cache_write }}
      ui_source: ${{ needs.plan.outputs.ui_source == 'true' }}
      ui_browser: ${{ needs.plan.outputs.ui_browser == 'true' }}
      help: ${{ needs.plan.outputs.help == 'true' }}
      catalog: ${{ needs.plan.outputs.catalog == 'true' }}
  required:
    name: required
    needs:
      - plan
      - format
      - tooling
      - governance
      - fast
      - build
      - rust
      - targeted_build
      - targeted
      - web
      - catalog_unit
      - ui
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - name: Download ordinary shard evidence
        if: needs.plan.outputs.rust == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: qualification-results-ordinary-*-${{ github.run_attempt }}
          path: .release/downloaded
      - name: Verify ordinary shard execution evidence
        if: needs.plan.outputs.rust == 'true'
        run: node scripts/ci-evidence.mjs
        env:
          CI_PACKAGES: ${{ needs.plan.outputs.packages }}
          CI_SOURCE: ${{ needs.plan.outputs.source }}
      - name: Download targeted backend shard evidence
        if: needs.plan.outputs.backend == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: qualification-results-targeted-*-${{ github.run_attempt }}
          path: .release/downloaded
      - name: Verify targeted backend shard execution evidence
        if: needs.plan.outputs.backend == 'true'
        run: node scripts/ci-evidence.mjs targeted
        env:
          CI_PACKAGES: ${{ needs.plan.outputs.backend_packages }}
          CI_SOURCE: ${{ needs.plan.outputs.source }}
      - name: Report cache and execution timings
        run: node scripts/ci-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/ci-required.mjs
        env:
          CI_PLAN: ${{ toJSON(needs.plan.outputs) }}
          CI_JOBS: ${{ toJSON(needs) }}
  cache_trial:
    name: Compilation cache comparison
    needs:
      - plan
      - required
    if:
      github.event_name == 'workflow_dispatch' && inputs.cache_trial &&
      github.repository == 'stevejuma/jj-store' && github.ref !=
      'refs/heads/main'
    uses: ./.github/workflows/ci-cache-trial.yml
    with:
      source: ${{ needs.plan.outputs.source }}
