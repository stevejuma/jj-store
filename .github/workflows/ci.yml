name: PR checks
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ""
      all_checks:
        type: boolean
        default: false
        description: Run all standard checks
      cache_trial:
        type: boolean
        default: false
        description:
          Run the bounded three-pair compilation-cache comparison (branch only)
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      all_checks:
        type: boolean
        default: false
        description: Run all standard checks
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      packages: ${{ steps.plan.outputs.packages }}
      cache_write: ${{ steps.plan.outputs.cache_write }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_ALL_CHECKS: ${{ inputs.all_checks }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
    name: Change selection
  format:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - name: Rust and source formatting
        run: |
          pnpm format:rust:check
          pnpm exec prettier --check .
    name: Formatting
  tooling:
    needs:
      - plan
      - format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - name: Governance fixtures
        run: pnpm test:governance
      - name: Specification tooling
        run: pnpm test:spec
      - name: Release and CI tooling
        run: pnpm release:check
    name: Tooling regression tests
  governance:
    needs:
      - plan
      - format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Static architecture and specification checks
        run: |
          pnpm check:architecture
          pnpm check:ui-ownership
          pnpm spec:validate --only governance,summary,fileLimits,verification
      - name: Progress evidence gate
        if: |-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run: pnpm check:progress
      - name: Spec-first gate
        if: |-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run:
          pnpm spec:first --base "$JJ_STORE_CHECK_BASE" --head
          "$JJ_STORE_CHECK_REVISION"
      - name: Release intent gate
        if: |-
          github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && !(github.event.pull_request.user.login == 'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run: node scripts/changeset-check.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - name: Install checksum-pinned actionlint
        run: |
          tool_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          archive="$tool_dir/actionlint.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$archive" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -version
          echo "$tool_dir" >> "$GITHUB_PATH"
      - run: actionlint
    name: Specification and release policy
  fast:
    needs:
      - plan
      - format
      - tooling
      - governance
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - run: node scripts/ci-required.mjs
        env:
          CI_STAGE: early
          CI_PLAN: "{}"
          CI_JOBS: ${{ toJSON(needs) }}
    name: Preflight gate
  build:
    needs:
      - plan
      - fast
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: target
      CI_PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
        id: rust-cache
        name: Restore Rust dependency cache
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - run: node scripts/ci-build.mjs ordinary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-ordinary
          path: .release/tests-ordinary.tar.zst*
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
    name: Build standard Rust tests
  rust:
    needs:
      - plan
      - build
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      CARGO_TARGET_DIR: target
      CI_SHARD: ${{ matrix.shard }}
      CI_PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tests-ordinary
          path: .release
      - run: node scripts/ci-tests.mjs run ordinary
    name: Standard Rust tests (shard ${{ matrix.shard }}/4)
  web:
    needs:
      - plan
      - fast
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - run: |
          pnpm web:check
          pnpm catalog:check
          pnpm web:test
          pnpm catalog:test
    if: needs.plan.outputs.web == 'true'
    name: Web type checks and unit tests
  ui:
    name: UI acceptance
    needs: [plan, fast]
    if: needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/ci-ui.yml
    with:
      source: ${{ needs.plan.outputs.source }}
      cache_write: ${{ needs.plan.outputs.cache_write }}
  required:
    name: required
    needs:
      - plan
      - format
      - tooling
      - governance
      - fast
      - build
      - rust
      - web
      - ui
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
      - name: Report cache and execution timings
        run: node scripts/ci-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node scripts/ci-required.mjs
        env:
          CI_PLAN: ${{ toJSON(needs.plan.outputs) }}
          CI_JOBS: ${{ toJSON(needs) }}
  cache_trial:
    name: Compilation cache comparison
    needs:
      - plan
      - required
    if:
      github.event_name == 'workflow_dispatch' && inputs.cache_trial &&
      github.repository == 'stevejuma/jj-store' && github.ref !=
      'refs/heads/main'
    uses: ./.github/workflows/ci-cache-trial.yml
    with:
      source: ${{ needs.plan.outputs.source }}
