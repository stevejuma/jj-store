name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  schedule:
    - cron: 21 2 * * *
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      web: ${{ steps.plan.outputs.web }}
      heavy: ${{ steps.plan.outputs.heavy }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          CI_FULL: ${{ inputs.full }}
          CI_EVENT: ${{ github.event_name }}
  format:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - name: Rust and source formatting
        run: |
          pnpm format:rust:check
          pnpm exec prettier --check .
  tooling:
    needs:
      - plan
      - format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - name: Governance fixtures
        run: pnpm test:governance
      - name: Specification tooling
        run: pnpm test:spec
      - name: Release and CI tooling
        run: pnpm release:check
  governance:
    needs:
      - plan
      - format
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
        with:
          native-dependencies: "false"
          build-tools: "false"
      - run: node scripts/ci-range.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA:
            ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Static architecture and specification checks
        run: |
          pnpm check:architecture
          pnpm check:ui-ownership
          pnpm spec:validate --only governance,summary,fileLimits,verification
      - name: Progress evidence gate
        if: >-
          github.event_name == 'pull_request' && github.head_ref !=
          'changeset-release/main' && !(github.event.pull_request.user.login ==
          'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run: pnpm check:progress
      - name: Spec-first gate
        if: >-
          github.event_name == 'pull_request' && github.head_ref !=
          'changeset-release/main' && !(github.event.pull_request.user.login ==
          'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run:
          pnpm spec:first --base "$JJ_STORE_CHECK_BASE" --head
          "$JJ_STORE_CHECK_REVISION"
      - name: Release intent gate
        if: >-
          github.event_name == 'pull_request' && github.head_ref !=
          'changeset-release/main' && !(github.event.pull_request.user.login ==
          'dependabot[bot]' &&
            startsWith(github.head_ref, 'dependabot/'))
        run: node scripts/changeset-check.mjs
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: actionlint@1.7.12
      - run: actionlint
  fast:
    needs:
      - format
      - tooling
      - governance
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - run: node scripts/ci-required.mjs
        env:
          CI_STAGE: early
          CI_PLAN: "{}"
          CI_JOBS: ${{ toJSON(needs) }}
  build:
    needs:
      - plan
      - fast
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          save-if:
            ${{ github.ref == 'refs/heads/main' && github.event_name == 'push'
            }}
          key: ordinary-1.99
      - run: node scripts/ci-build.mjs ordinary
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tests-ordinary
          path: .release/tests-ordinary.tar.zst
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
  rust:
    needs:
      - plan
      - build
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
    env:
      CARGO_TARGET_DIR: target
      CI_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tests-ordinary
          path: .release
      - run: node scripts/ci-tests.mjs run ordinary
  web:
    needs:
      - plan
      - fast
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - uses: ./.github/actions/setup
      - run: |
          pnpm web:check
          pnpm catalog:check
          pnpm web:test
          pnpm catalog:test
    if: needs.plan.outputs.web == 'true'
  heavy:
    needs:
      - plan
      - fast
      - build
      - rust
      - web
    if:
      "!cancelled() && needs.fast.result == 'success' && (needs.plan.outputs.web
      != 'true' || needs.web.result == 'success') && (needs.plan.outputs.rust !=
      'true' || (needs.build.result == 'success' && needs.rust.result ==
      'success')) && (needs.plan.outputs.heavy == 'true' ||
      needs.plan.outputs.web == 'true' || needs.plan.outputs.full == 'true')"
    uses: ./.github/workflows/ci-heavy.yml
    with:
      ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      heavy: ${{ needs.plan.outputs.heavy == 'true' }}
      web: ${{ needs.plan.outputs.web == 'true' }}
      full: ${{ needs.plan.outputs.full == 'true' }}
  required:
    name: required
    needs:
      - plan
      - format
      - tooling
      - governance
      - fast
      - build
      - rust
      - web
      - heavy
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref:
            ${{ inputs.ref || github.event.pull_request.head.sha || github.sha
            }}
      - run: node scripts/ci-required.mjs
        env:
          CI_PLAN: ${{ toJSON(needs.plan.outputs) }}
          CI_JOBS: ${{ toJSON(needs) }}
