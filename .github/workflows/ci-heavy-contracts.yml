name: API contract qualification
run-name:
  API contract qualification · ${{ inputs.source }} · producer ${{
  inputs.producer_run || github.run_id }}/${{ inputs.producer_attempt ||
  github.run_attempt }}
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: true
        description: Full qualification producer run ID
      producer_attempt:
        type: string
        required: true
        description: Producer run attempt
  workflow_call:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: false
        description: Full qualification producer run ID
        default: ""
      producer_attempt:
        type: string
        required: false
        description: Producer run attempt
        default: ""
      cache_write:
        type: string
        default: "false"
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
  CI_SOURCE: ${{ inputs.source }}
  CI_PRODUCER_RUN: ${{ inputs.producer_run || github.run_id }}
  CI_PRODUCER_ATTEMPT: ${{ inputs.producer_attempt || github.run_attempt }}
  JJ_STORE_CI_REPORTS: "1"
  PLAYWRIGHT_JUNIT_OUTPUT_FILE:
    ${{ github.workspace }}/.release/ci-results/playwright.xml
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}
jobs:
  tests:
    name: Generated API contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Verify source, successful producers and artifact checksums
        run:
          node scripts/ci-exec.mjs artifact-download -- node
          scripts/ci-artifacts.mjs consume contracts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if:
            ${{ inputs.cache_write == 'true' && inputs.producer_run == '' }}
          key: storage-contracts-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
        id: rust-cache
        name: Restore Rust dependency cache
      - name: Generate and validate HTTP contracts
        run:
          node scripts/ci-exec.mjs contracts -- node scripts/ci-storage.mjs
          contracts
      - name: Preserve results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: contracts
concurrency:
  group: qualification-contracts-${{ inputs.source }}-${{ github.event_name }}
  cancel-in-progress: false
