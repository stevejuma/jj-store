name: Manual qualification
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        default: ""
        description: Source ref or SHA (defaults to selected workflow revision)
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
jobs:
  resolve:
    name: Resolve qualification source
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      source: ${{ steps.source.outputs.source }}
      cache_write: ${{ steps.source.outputs.cache_write }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
      - id: source
        run: node scripts/ci-source.mjs
      - run: node scripts/ci-artifacts.mjs pack source
      - name: Upload source provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-source-${{ github.run_attempt }}
          path: .release/qualification/source.json
          if-no-files-found: error
          retention-days: 7
  standard:
    name: Standard checks
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.source }}
      all_checks: true
  build:
    name: Backend compilation
    needs:
      - resolve
      - standard
    uses: ./.github/workflows/ci-qualification-build.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
      kind: build
  runtime:
    name: Embedded runtime
    needs:
      - resolve
      - standard
    uses: ./.github/workflows/ci-qualification-build.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
      kind: runtime
  assets:
    name: Browser assets
    needs:
      - resolve
      - build
    uses: ./.github/workflows/ci-qualification-build.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
      kind: assets
  backend:
    name: Backend Rust tests
    needs:
      - resolve
      - build
    uses: ./.github/workflows/ci-heavy-backend.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
  contracts:
    name: API contracts
    needs:
      - resolve
      - standard
    uses: ./.github/workflows/ci-heavy-contracts.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
  external:
    name: External storage
    needs:
      - resolve
      - standard
    uses: ./.github/workflows/ci-heavy-storage.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
      lane: external
  embedded:
    name: Embedded storage
    needs:
      - resolve
      - runtime
    uses: ./.github/workflows/ci-heavy-storage.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
      lane: embedded
  native:
    name: Native platforms
    needs:
      - resolve
      - standard
    uses: ./.github/workflows/ci-heavy-native.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
  ui:
    name: UI acceptance
    needs:
      - resolve
      - assets
    uses: ./.github/workflows/ci-heavy-ui.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
  cold:
    name: Cold application
    needs:
      - resolve
      - assets
      - runtime
    uses: ./.github/workflows/ci-heavy-cold.yml
    with:
      source: ${{ needs.resolve.outputs.source }}
      cache_write: ${{ needs.resolve.outputs.cache_write }}
  complete:
    name: Complete qualification gate
    needs:
      - resolve
      - standard
      - build
      - runtime
      - assets
      - backend
      - contracts
      - external
      - embedded
      - native
      - ui
      - cold
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.resolve.outputs.source }}
      - name: Preserve results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: complete
      - run: node scripts/ci-required.mjs
        env:
          CI_STAGE: heavy
          CI_PLAN: "{}"
          CI_JOBS: ${{ toJSON(needs) }}
concurrency:
  group: qualification-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false
