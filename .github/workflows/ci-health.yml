name: Nightly validation health
on:
  schedule:
    - cron: "43 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freshness:
    if: github.repository == 'stevejuma/jj-store'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: node scripts/ci-health.mjs
        env:
          GH_TOKEN: ${{ github.token }}
