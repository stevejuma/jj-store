name: Native compatibility qualification
run-name:
  Native compatibility qualification · ${{ inputs.source }} · producer ${{
  inputs.producer_run || github.run_id }}/${{ inputs.producer_attempt ||
  github.run_attempt }}
on:
  workflow_dispatch:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: true
        description: Full qualification producer run ID
      producer_attempt:
        type: string
        required: true
        description: Producer run attempt
  workflow_call:
    inputs:
      source:
        type: string
        required: true
        description: Exact source commit SHA
      producer_run:
        type: string
        required: false
        description: Full qualification producer run ID
        default: ""
      producer_attempt:
        type: string
        required: false
        description: Producer run attempt
        default: ""
      cache_write:
        type: string
        default: "false"
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  JJ_STORE_BUILD_TARGET_GIB: "24"
  JJ_STORE_BUILD_TOTAL_GIB: "36"
  JJ_STORE_BUILD_FREE_GIB: "6"
  CI_SOURCE: ${{ inputs.source }}
  CI_PRODUCER_RUN: ${{ inputs.producer_run || github.run_id }}
  CI_PRODUCER_ATTEMPT: ${{ inputs.producer_attempt || github.run_attempt }}
  JJ_STORE_CI_REPORTS: "1"
  PLAYWRIGHT_JUNIT_OUTPUT_FILE:
    ${{ github.workspace }}/.release/ci-results/playwright.xml
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}
jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source }}
          fetch-depth: 0
      - name: Verify source, successful producers and artifact checksums
        run:
          node scripts/ci-exec.mjs artifact-download -- node
          scripts/ci-artifacts.mjs consume native
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> target
          save-if:
            ${{ inputs.cache_write == 'true' && inputs.producer_run == '' }}
          key: native-${{ matrix.target }}-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
        id: rust-cache
        name: Restore Rust dependency cache
      - name: Verify native compiler target
        run: |
          rustc -vV | grep -Fx 'host: ${{ matrix.target }}'
      - name: Build native CLI
        run:
          node scripts/ci-exec.mjs build -- pnpm dev:cargo -- build -p jj-store
          --bins --locked
      - name: Run native tests
        run:
          node scripts/ci-exec.mjs tests -- pnpm dev:cargo -- test -p
          jj-store-read-index -p jj-collab -p jj-store-capture --locked --
          --test-threads=1
      - name: Preserve results and timing evidence
        if: always()
        uses: ./.github/actions/qualification-report
        with:
          name: native-${{ matrix.target }}
    name: Native compatibility (${{ matrix.target }})
concurrency:
  group: qualification-native-${{ inputs.source }}-${{ github.event_name }}
  cancel-in-progress: false
