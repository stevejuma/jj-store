name: Qualification evidence
description:
  Preserve logs, test reports and machine-readable timings even after failures
inputs:
  name:
    description: Unique suite, shard or producer label
    required: true
runs:
  using: composite
  steps:
    - name: Collect reports and job timings
      shell: bash
      run: node scripts/ci-report.mjs
      env:
        GH_TOKEN: ${{ github.token }}
        CI_REPORT_NAME: ${{ inputs.name }}
    - name: Upload reports, inventories and failure traces
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: qualification-results-${{ inputs.name }}-${{ github.run_attempt }}
        path: |
          .release/ci-results
          .scratch/rustfs-contract.json
          target/nextest/heavy/*.xml
          web/test-results*
          test-results
        include-hidden-files: true
        retention-days: 7
        if-no-files-found: warn
