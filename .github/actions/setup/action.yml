name: Release toolchain
description: Pinned tools and registry-only workspace dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
        cache: pnpm
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: '1.99.0'
        components: rustfmt,clippy
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
      with:
        tool: cargo-nextest@0.9.148,mdbook@0.5.4,uv@0.9.28
    - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      shell: bash
