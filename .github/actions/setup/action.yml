name: Release toolchain
description: Pinned tools and local-source Rust integration dependencies
inputs:
  capability:
    description:
      Full, tooling, formatting, archived Rust, or Node/browser dependencies
    default: full
  fetch-rust:
    description:
      Fetch Rust dependencies now (disable when restoring a cache first)
    default: "true"
  native-dependencies:
    description: Install credential-store headers for native crate builds
    default: "true"
  build-tools:
    description: Install archived-test and documentation build tools
    default: "true"
runs:
  using: composite
  steps:
    - name: Validate setup capability
      shell: bash
      run: |
        case "$SETUP_CAPABILITY" in full|tooling|format|archive|node) ;; *) exit 1 ;; esac
      env:
        SETUP_CAPABILITY: ${{ inputs.capability }}
    - name: Select hosted validation runtime
      shell: bash
      run: echo "JJ_STORE_VALIDATION_RUNTIME=native" >> "$GITHUB_ENV"
    - name: Install Linux native credential-store build dependencies
      if:
        inputs.capability == 'full' && runner.os == 'Linux' &&
        inputs.native-dependencies == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y pkg-config libdbus-1-dev
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 22
        cache: pnpm
    - name: Materialize pinned shared Rust sources into sibling Cargo paths
      if: inputs.capability != 'node' && inputs.capability != 'format'
      run: |
        node scripts/ci-lapis-source.mjs
        node scripts/ci-redaction-source.mjs
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install pinned upstream JJ for repository fixtures
      if: inputs.capability != 'node' && inputs.capability != 'format'
      run: node scripts/ci-setup-jj.mjs
      shell: bash
    - if: inputs.capability != 'node' && inputs.capability != 'format'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: "3.12"
    - if: inputs.capability != 'node'
      uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
      with:
        toolchain: "1.99.0"
        components:
          ${{ inputs.capability == 'format' && 'rustfmt' || inputs.capability ==
          'full' && 'rustfmt,clippy' || '' }}
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
      if: inputs.capability == 'full' && inputs.build-tools == 'true'
      with:
        tool: cargo-nextest@0.9.148,mdbook@0.5.4,uv@0.9.28
    - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
      if: inputs.capability == 'archive'
      with:
        tool: cargo-nextest@0.9.148
    - run: pnpm install --frozen-lockfile --ignore-pnpmfile
      shell: bash
    - name: Provision registry metadata for offline governance installs
      if: inputs.capability == 'full' || inputs.capability == 'tooling'
      run: node scripts/ci-provision-offline-governance.mjs
      shell: bash
    - name: Fetch locked Rust dependencies for offline governance checks
      if:
        (inputs.capability == 'full' || inputs.capability == 'tooling') &&
        inputs.fetch-rust == 'true'
      run: cargo fetch --locked
      shell: bash
    - name: Install shared AI development packaging dependencies
      if: inputs.capability == 'full' || inputs.capability == 'tooling'
      run: pnpm install --frozen-lockfile
      working-directory: ../lapis-ai
      shell: bash
