[package]
name = "jj-store-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jj-collab.workspace = true
jj-review.workspace = true
jj-store-adapters.workspace = true
schemars.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-wal.workspace = true
jj-store-jj.workspace = true
tokio = { version = "1", features = ["time", "sync"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
zeroize = "1"
getrandom = "0.4"
hex = "0.4"
thiserror = "2"
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
image = {version="0.25",default-features=false,features=["png"]}
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
