[workspace]
members = ["crates/terminal-engine"]

[package]
name = "jj-store-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[features]
default = ["native"]
native = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:window-vibrancy", "dep:objc2", "dep:block2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[dependencies]
sha2 = "0.10"
jj-store-terminal-engine = { path = "crates/terminal-engine" }
portable-pty = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"], optional = true }
tauri-plugin-single-instance = { version = "=2.4.2", optional = true }
tauri-plugin-window-state = { version = "=2.4.1", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-dialog = { version = "=2.7.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = { version = "=0.6.0", optional = true }
objc2 = { version = "=0.6.4", optional = true }
block2 = { version = "=0.6.2", optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSView", "NSButton"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"], optional = true }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jj-store-desktop"
required-features = ["native"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
