[workspace]

[package]
name = "jj-store-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

[features]
default = ["native"]
native = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
tauri = { version = "=2.11.5", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "=2.4.2", optional = true }
tauri-plugin-window-state = { version = "=2.4.1", optional = true }
tauri-plugin-opener = { version = "=2.5.4", optional = true }
tauri-plugin-dialog = { version = "=2.7.1", optional = true }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "jj-store-desktop"
required-features = ["native"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
