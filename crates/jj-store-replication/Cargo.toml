[package]
name = "jj-store-replication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store replication for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1"
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-wal.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "sync", "time"] }

[dev-dependencies]
async-trait = "0.1"
jj-agent.workspace = true
jj-review.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
