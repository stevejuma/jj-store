[package]
name = "jj-store-conversations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Host-injected conversation coordination and private agent stream processing"

[features]
default = []
native-privacy = ["dep:lapis-agent-redaction"]
store-capture = [
    "dep:jj-agent",
    "dep:jj-collab",
    "dep:jj-store-core",
    "dep:jj-store-model",
    "dep:serde",
]

[dependencies]
lapis-agent-redaction = { workspace = true, optional = true }
jj-agent = { workspace = true, optional = true }
jj-collab = { workspace = true, optional = true }
jj-store-core = { workspace = true, optional = true }
jj-store-model = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
async-trait = "0.1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
futures = "0.3"
tempfile = "3"

[[test]]
name = "native_privacy"
required-features = ["native-privacy"]

[[test]]
name = "store_capture"
required-features = ["store-capture"]
