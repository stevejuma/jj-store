[package]
name = "jj-store-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jj-store-model.workspace = true
jj-store-service.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2", "matched-path"] }
http-body = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
