[package]
name = "jj-store-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
schemars.workspace = true
jj-store-model.workspace = true
jj-store-service.workspace = true
jj-store-tantivy.workspace = true
jj-store-adapters.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2", "matched-path", "ws"] }
http-body = "1"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
tokio = { version = "1", features = ["rt", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio-tungstenite = "0.29"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
