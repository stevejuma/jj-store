syntax = "proto3";
package jj_store.native.v1;

// Every request requires an admitted authenticated or LocalTrusted peer. Only
// typed immutable objects and guarded publications cross this boundary.
service NativeStore {
  rpc CreateRepository(CreateRepositoryRequest) returns (Snapshot);
  rpc Tokens(Repository) returns (TokenListing);
  rpc ChangeToken(TokenRequest) returns (TokenReply);
  rpc TokenStatus(TokenRequest) returns (TokenReply);
  rpc Authorize(AccessRequest) returns (Empty);
  rpc Heads(Repository) returns (Ids);
  rpc Inventory(InventoryRequest) returns (Ids);
  rpc Publish(PublishRequest) returns (Empty);
  rpc PrepareAgentCapture(AgentCapturePrepareRequest) returns (AgentCapturePrepared);
  rpc PublishAgentDelta(AgentDeltaPublishRequest) returns (AgentPublicationReply);
  rpc ReviewThreads(ReviewThreadsRequest) returns (JsonReply);
  rpc ReviewThread(ReviewThreadRequest) returns (JsonReply);
  rpc ApplyReviewCommand(ReviewCommandRequest) returns (JsonReply);
  rpc ReviewCommandStatus(ReviewCommandStatusRequest) returns (JsonReply);
  rpc NegotiateReplica(ReplicationRequest) returns (JsonReply);
  rpc GetCommittedFeed(ReplicationRequest) returns (JsonReply);
  rpc OfferOrigins(ReplicationRequest) returns (JsonReply);
  rpc GetOriginClosure(ReplicationRequest) returns (JsonReply);
  rpc ApplyOrigins(ReplicationRequest) returns (JsonReply);
  rpc ReadControlRecord(ControlRecordRequest) returns (stream ObjectChunk);
  rpc WriteControlRecord(stream ControlUploadChunk) returns (UploadResult);
  rpc HeadObject(ObjectRequest) returns (ObjectMetadata);
  rpc ReadObject(ObjectRequest) returns (stream ObjectChunk);
  rpc WriteObject(stream UploadChunk) returns (UploadResult);
}
// The caller retains all three creation values across uncertain outcomes.
message CreateRepositoryRequest {
  bytes repository = 1;
  bytes epoch = 2;
  string admin_credential = 3;
  string name = 4;
}
message Snapshot {
  bytes epoch = 1;
  uint64 position = 2;
  repeated bytes heads = 3;
  uint64 code_state_version = 4;
}
enum TokenPermission { PERMISSION_UNSPECIFIED = 0; READ = 1; WRITE = 2; ADMIN = 3; }
message TokenDescription { bytes id = 1; bytes principal = 2; TokenPermission permission = 3; optional uint64 expires_at = 4; }
message TokenListing { Snapshot snapshot = 1; repeated TokenDescription tokens = 2; }
message TokenGrant { string credential = 1; bytes principal = 2; TokenPermission permission = 3; optional uint64 expires_at = 4; }
message TokenRequest {
  bytes repository = 1;
  bytes request_id = 2;
  Snapshot expected = 3;
  oneof change { TokenGrant grant = 4; bytes revoke = 5; }
}
message TokenReceipt {
  bytes request_id = 1; bytes publication_id = 2; Snapshot accepted = 3;
  oneof result { TokenDescription granted = 4; bytes revoked = 5; }
}
// An absent receipt means pending/unknown, never a confirmed rejection.
message TokenReply { TokenReceipt receipt = 1; }
message Empty {}
message Repository { bytes repository = 1; }
message AccessRequest { bytes repository = 1; bool write = 2; }
message InventoryRequest { bytes repository = 1; bool copies = 2; uint32 limit = 3; }
message Ids { repeated bytes ids = 1; }
message PublishRequest { bytes repository = 1; repeated bytes removed = 2; bytes added = 3; }
// Agent models use bounded canonical JSON so their native identities remain
// byte-equivalent to the durable device spool and WAL request.
message AgentCapturePrepareRequest {
  bytes repository = 1;
  bytes request_id = 2;
  bytes publication_id = 3;
  bytes profile_json = 4;
  bytes batch_json = 5;
  bytes result = 6;
}
message AgentCapturePrepared { bytes request_json = 1; }
message AgentDeltaPublishRequest { bytes repository = 1; bytes request_json = 2; }
message AgentPublicationIdentity { bytes request_id = 1; bytes publication_id = 2; }
message AgentReceipt {
  bytes principal = 1;
  bytes request_id = 2;
  bytes publication_id = 3;
  bytes intent = 4;
  Snapshot accepted = 5;
  bytes result = 6;
}
message AgentPublicationReply {
  oneof outcome { AgentReceipt committed = 1; AgentPublicationIdentity unknown = 2; }
}
// ReviewStore models cross RPC as bounded canonical JSON so the native CLI and
// HTTP application consume the same public service contracts.
message ReviewThreadsRequest { bytes repository = 1; uint32 limit = 2; string cursor = 3; }
message ReviewThreadRequest { bytes repository = 1; bytes thread_id = 2; }
message ReviewCommandRequest { bytes repository = 1; bytes request_json = 2; }
message ReviewCommandStatusRequest { bytes repository = 1; bytes request_id = 2; }
message JsonReply { bytes json = 1; }
// Replication DTOs use bounded canonical JSON and never carry a principal. The
// server derives the publication actor from the authenticated request.
message ReplicationRequest { bytes repository = 1; bytes request_json = 2; }
message ControlRecordId { uint32 kind = 1; bytes digest = 2; }
message ControlRecordRequest { bytes repository = 1; ControlRecordId record = 2; }
message ControlUploadStart { bytes repository = 1; ControlRecordId record = 2; uint64 length = 3; }
message ControlUploadChunk {
  oneof part { ControlUploadStart start = 1; bytes data = 2; }
}
message ObjectId { uint32 kind = 1; bytes id = 2; }
message ObjectRequest { bytes repository = 1; ObjectId object = 2; }
message ObjectMetadata { uint64 length = 1; string version = 2; }
// First message is metadata, followed by nonempty bounded data chunks.
message ObjectChunk {
  oneof part { ObjectMetadata metadata = 1; bytes data = 2; }
}
// First message binds identity and exact framed length; no other headers follow.
message UploadStart { bytes repository = 1; ObjectId object = 2; uint64 length = 3; }
message UploadChunk {
  oneof part { UploadStart start = 1; bytes data = 2; }
}
message UploadResult {
  enum Outcome { UNSPECIFIED = 0; STORED = 1; ALREADY_PRESENT = 2; UNKNOWN = 3; }
  Outcome outcome = 1;
  string version = 2;
}
