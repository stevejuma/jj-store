syntax = "proto3";
package jj_store.native.v1;

// Bearer authorization is required on every request. Only typed immutable
// native objects and guarded head transitions cross this boundary.
service NativeStore {
  rpc Authorize(AccessRequest) returns (Empty);
  rpc Heads(Repository) returns (Ids);
  rpc Inventory(InventoryRequest) returns (Ids);
  rpc Publish(PublishRequest) returns (Empty);
  rpc HeadObject(ObjectRequest) returns (ObjectMetadata);
  rpc ReadObject(ObjectRequest) returns (stream ObjectChunk);
  rpc WriteObject(stream UploadChunk) returns (UploadResult);
}
message Empty {}
message Repository { bytes repository = 1; }
message AccessRequest { bytes repository = 1; bool write = 2; }
message InventoryRequest { bytes repository = 1; bool copies = 2; uint32 limit = 3; }
message Ids { repeated bytes ids = 1; }
message PublishRequest { bytes repository = 1; repeated bytes removed = 2; bytes added = 3; }
message ObjectId { uint32 kind = 1; bytes id = 2; }
message ObjectRequest { bytes repository = 1; ObjectId object = 2; }
message ObjectMetadata { uint64 length = 1; string version = 2; }
// First message is metadata, followed by nonempty bounded data chunks.
message ObjectChunk {
  oneof part { ObjectMetadata metadata = 1; bytes data = 2; }
}
// First message binds identity and exact framed length; no other headers follow.
message UploadStart { bytes repository = 1; ObjectId object = 2; uint64 length = 3; }
message UploadChunk {
  oneof part { UploadStart start = 1; bytes data = 2; }
}
message UploadResult {
  enum Outcome { UNSPECIFIED = 0; STORED = 1; ALREADY_PRESENT = 2; UNKNOWN = 3; }
  Outcome outcome = 1;
  string version = 2;
}
