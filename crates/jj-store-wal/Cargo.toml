[package]
name = "jj-store-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
schemars.workspace = true
jj-agent.workspace = true
jj-review.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.4"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
