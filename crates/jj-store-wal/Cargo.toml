[package]
name = "jj-store-wal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store wal for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
jj-store-core.workspace = true
jj-workflow.workspace = true
jj-collab.workspace = true
jj-work.workspace = true
schemars.workspace = true
jj-agent.workspace = true
jj-review.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
getrandom = "0.4"
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
