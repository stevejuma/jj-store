[package]
name = "jj-store-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store adapters for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-wal.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "test-util"] }
