[workspace]

[package]
name = "jj-store-embedding-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
readme = "README.md"
description = "Independent source consumer for injectable collaboration stores"

[features]
default = ["stock-jj"]
stock-jj = ["dep:jj-lib", "dep:jj-store-jj"]
native = ["dep:jj-store-native", "dep:jj-store-wal", "dep:jj-store-object"]

[dependencies]
jj-store-core = { path = "../../../../jj-store-core", version = "0.1.0" }
jj-store-git = { path = "../../../../jj-store-git", version = "0.1.0" }
jj-store-model = { path = "../../../../jj-store-model", version = "0.1.0" }
jj-agent = { path = "../../../../jj-agent", version = "0.1.0" }
jj-work = { path = "../../../../jj-work", version = "0.1.0" }
jj-review = { path = "../../../../jj-review", version = "0.1.0" }
jj-collab = { path = "../../../../jj-collab", version = "0.1.0" }
jj-store-jj = { path = "../../..", version = "0.1.0", default-features = false, features = ["companion"], optional = true }
jj-store-native = { path = "../../../../jj-store-native", version = "0.1.0", optional = true }
jj-store-wal = { path = "../../../../jj-store-wal", version = "0.1.0", optional = true }
jj-store-object = { path = "../../../../jj-store-object", version = "0.1.0", optional = true }
jj-lib = { version = "=0.45.1", optional = true }
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "max-performance-safe"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serde_json = "1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
