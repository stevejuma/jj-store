[package]
name = "jj-store-jj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store jj for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[features]
default = ["native"]
companion = ["tokio/time"]
local-history = ["companion", "tokio/macros", "dep:prost", "tokio/fs", "tokio/io-util", "tokio/sync", "tokio/rt", "dep:async-trait", "dep:futures", "dep:tempfile", "dep:tokio-util", "dep:redb", "dep:etcetera", "dep:whoami", "dep:blake2", "dep:chrono"]
vault-backup = ["dep:cap-fs-ext", "dep:rustix", "dep:cap-tempfile", "local-history", "dep:cap-std", "tokio/process", "dep:base64", "dep:zeroize", "dep:url"]
native = ["local-history", "gix/default", "companion", "tokio/fs", "tokio/io-util", "tokio/sync", "tokio/rt", "tokio/process", "dep:jj-store-object", "dep:jj-store-wal", "dep:jj-forge", "dep:redb", "dep:prost", "dep:prost-build", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "dep:base64", "dep:zeroize", "dep:url", "dep:async-trait", "dep:toml", "dep:blake2", "dep:chrono", "dep:tempfile", "dep:futures", "dep:etcetera", "dep:whoami", "dep:tokio-util", "dep:rustix"]

[dependencies]
jj-store-git.workspace = true
cap-tempfile = { version = "4", optional = true }
cap-fs-ext = { version = "=4.0.3", optional = true }
cap-std = { version = "=4.0.3", optional = true }
base64 = { version = "0.23", optional = true }
zeroize = { version = "1", optional = true }
url = { version = "2", optional = true }
jj-forge = { workspace = true, optional = true }
schemars.workspace = true
jj-lib.workspace = true
jj-store-model.workspace = true
jj-store-object = { workspace = true, optional = true }
jj-store-wal = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1.6", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
blake2 = { version = "0.11", optional = true }
sha2 = "0.11"
chrono = { version = "0.4", optional = true }
tempfile = { version = "3", optional = true }
thiserror = "2"
futures = { version = "0.3", optional = true }
gix = { version = "=0.88.0", default-features = false, features = ["sha1", "max-performance-safe"] }
etcetera = { version = "0.11", optional = true }
whoami = { version = "2.1", optional = true }
tokio-util = { version = "0.7", features = ["compat"] , optional = true }
redb = { version = "=4.4.0", optional = true }
prost = { version = "0.14", optional = true }
rustix = { version = "=1.1.5", features = ["fs", "process"] , optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
prost-build = { version = "0.14", optional = true }
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

