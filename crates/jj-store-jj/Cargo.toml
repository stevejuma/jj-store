[package]
name = "jj-store-jj"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store jj for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
schemars.workspace = true
jj-lib.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-wal.workspace = true
async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.6"
serde_json = { version = "1", features = ["preserve_order"] }
blake2 = "0.10"
sha2 = "0.10"
chrono = "0.4"
tempfile = "3"
thiserror = "2"
futures = "0.3"
gix = "=0.87.1"
etcetera = "0.11"
whoami = "2.1"
tokio-util = { version = "0.7", features = ["compat"] }
redb = "=4.3.0"
prost = "0.14"
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
prost-build = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3"
