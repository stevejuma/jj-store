[package]
name = "jj-store-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jj-agent.workspace = true
jj-review.workspace = true
jj-cli.workspace = true
jj-lib.workspace = true
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
futures = "0.3"
gix = "0.87.1"

jj-store-rpc.workspace = true
jj-store-jj.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-service.workspace = true
jj-store-server.workspace = true
jj-store-wal.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
getrandom = "0.4"
tempfile = "3"
dirs = "6"
shlex = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
kingfisher-core = { git = "https://github.com/mongodb/kingfisher", rev = "63dccba231b6b01990c84319d25f92f49428a431" }
kingfisher-rules = { git = "https://github.com/mongodb/kingfisher", rev = "63dccba231b6b01990c84319d25f92f49428a431" }
kingfisher-scanner = { git = "https://github.com/mongodb/kingfisher", rev = "63dccba231b6b01990c84319d25f92f49428a431", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[[bin]]
name = "jj"
path = "src/main.rs"

[[bin]]
name = "jj-store"
path = "src/server_main.rs"

[dev-dependencies]
jj-store-tantivy.workspace = true
jj-store-adapters.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }
jj-store-http.workspace = true
axum = { version = "0.8", features = ["json", "query"] }
tower = { version = "0.5", features = ["util"] }
jj-store-wal.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tonic = { version = "0.14", features = ["transport"] }
tokio-stream = { version = "0.1", features = ["net"] }
rcgen = "0.14"
