[package]
name = "jj-store-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
jj-collab.workspace = true
pulldown-cmark = { version = "=0.13.4", default-features = false }
ed25519-dalek = "=3.0.0-rc.0"
jj-agent.workspace = true
rustix = { version = "=1.1.5", features = ["process"] }
notify = "8.2"
jj-store-capture.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-jj.workspace = true
jj-store-service.workspace = true
jj-store-rpc.workspace = true
jj-store-replication.workspace = true
jj-store-http.workspace = true
jj-store-adapters.workspace = true
jj-store-tantivy.workspace = true
zeroize = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
url = "2"
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
tempfile = "3"
getrandom = "0.4"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "process", "signal", "time", "rt", "io-util", "sync"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }

[dev-dependencies]
jj-store-wal.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
