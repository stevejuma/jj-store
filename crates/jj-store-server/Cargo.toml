[package]
name = "jj-store-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "jj store server for native Jujutsu repository storage"
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
lapis-ai-runtime.workspace = true
lapis-ai-config.workspace = true
jj-collab.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = { version = "=0.13.5", default-features = false }
ed25519-dalek = "=3.0.0"
jj-agent.workspace = true
rustix = { version = "=1.1.6", features = ["process"] }
notify = "8.2"
jj-store-capture.workspace = true
jj-store-conversations.workspace = true
jj-store-model.workspace = true
jj-store-object.workspace = true
jj-store-jj = { workspace = true, features = ["native"] }
jj-store-service.workspace = true
jj-store-rpc.workspace = true
jj-store-replication.workspace = true
jj-store-http.workspace = true
jj-store-adapters.workspace = true
jj-store-tantivy.workspace = true
zeroize = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
tower = { version = "0.5", features = ["limit"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
url = "2"
base64 = "0.23"
percent-encoding = "2"
thiserror = "2"
tempfile = "3"
getrandom = "0.4"
hex = "0.4"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["net", "process", "signal", "time", "rt", "io-util", "sync"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
jj-store-wal.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
